name: Checks

# The same checks the release runs before it builds anything, on every push and pull
# request, so a failure shows up before a tag does.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.5'

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: explorer
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: explorer/go.mod
          cache-dependency-path: explorer/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install web dependencies
        run: cd web && bun install --frozen-lockfile

      - run: make test
      - run: make vet
      - run: make web-check

      # The release build and smoke test, so a broken embed or build script is
      # caught here rather than on a tag.
      - name: Build and smoke test
        run: |
          OUT_DIR="$RUNNER_TEMP/dist" scripts/release-build.sh 0.0.0-ci linux-x64
          scripts/release-smoke.sh "$RUNNER_TEMP/dist/merlin-linux-x64" 0.0.0-ci
